version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-vite-app
    ports:
      - "3000:80"
    env_file:
      - .env.docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx-debug", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3