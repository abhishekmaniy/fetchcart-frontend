<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="title desc">

  <title id="title">FetchCart AI logo</title>
  <desc id="desc">Icon-only AI-powered shopping cart logo for FetchCart AI</desc>

  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC"></stop>
      <stop offset="100%" stop-color="#5B3FD4"></stop>
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"></stop>
      <stop offset="100%" stop-color="#06B6D4"></stop>
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="200" height="200" rx="44" ry="44" fill="url(#purpleGrad)"></rect>

  <!-- Cart handle -->
  <path d="M30 58 H48
           C54 58 58 62 60 68
           L64 82" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path>

  <!-- Cart basket -->
  <rect x="62" y="82" width="96" height="56" rx="8" ry="8" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></rect>

  <!-- Cart bottom rail -->
  <path d="M72 142 H148" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path>

  <!-- Inner product / recommendation rows -->
  <path d="M76 98 H146" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5"></path>

  <path d="M76 110 H136" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5"></path>

  <path d="M76 122 H148" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5"></path>

  <!-- Subtle AI node points inside basket -->
  <circle cx="92" cy="110" r="3" fill="#FFFFFF" opacity="0.65"></circle>
  <circle cx="118" cy="98" r="3" fill="#FFFFFF" opacity="0.65"></circle>
  <circle cx="134" cy="122" r="3" fill="#FFFFFF" opacity="0.65"></circle>

  <!-- Wheel left -->
  <circle cx="86" cy="158" r="11" fill="#FFFFFF"></circle>
  <circle cx="86" cy="158" r="5" fill="#6040E8"></circle>

  <!-- Wheel right -->
  <circle cx="134" cy="158" r="11" fill="#FFFFFF"></circle>
  <circle cx="134" cy="158" r="5" fill="#6040E8"></circle>

  <!-- AI sparkle vertical diamond -->
  <path d="M148 40
           C148 40 152 54 148 68
           C144 54 148 40 148 40 Z" fill="url(#tealGrad)"></path>

  <!-- AI sparkle horizontal diamond -->
  <path d="M134 54
           C134 54 148 50 162 54
           C148 58 134 54 134 54 Z" fill="url(#tealGrad)"></path>

  <!-- AI sparkle anchor -->
  <circle cx="148" cy="54" r="4" fill="#2DD4BF"></circle>

  <!-- Small secondary spark accents -->
  <circle cx="168" cy="42" r="3" fill="#2DD4BF"></circle>
  <circle cx="130" cy="70" r="2.5" fill="#06B6D4"></circle>

</svg>